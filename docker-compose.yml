# Compose usato da Coolify (risorsa "Docker Compose" collegata al repo GitHub).
# Coolify clona il repo al tag della versione (es. v1.1.0) e builda l'immagine:
# cambiare tag + APP_VERSION e fare Deploy = aggiornamento o rollback (vedi scripts/deploy.ps1).
services:
  collector:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: nextgendevops:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nextgen}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nextgen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
